<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>No Pr Fantasy — Home</title>
  <meta name="description" content="No Pr Fantasy — Fantasy Football" />
  <style>
    :root{
      --bg:#0b1220; /* page background color */
      --card:#ffffff;
      --accent:#0f6b8a;
      --muted:#6b7280;
      --text:#ffffff; /* default page text color (white on blue) */
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    /* blue gradient used previously: #071023 -> #072033 */
    html,body{height:100%;margin:0;background:linear-gradient(180deg,#071023 0%,#072033 60%);color:var(--text);}    
    .wrap{max-width:980px;margin:36px auto;padding:24px;}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{display:flex;align-items:center;gap:12px}
    .logo{width:56px;height:56px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:800;color:white}
    nav a{color:var(--text);text-decoration:none;margin-left:14px;font-weight:600;padding:8px 10px;border-radius:8px}
    nav a:hover{background:rgba(255,255,255,0.06)}
    main{margin-top:28px;display:grid;grid-template-columns:1fr;gap:18px}
    /* make the hero card use dark text so it reads on the white card */
    .hero{background:var(--card);padding:22px;border-radius:12px;box-shadow:0 6px 20px rgba(2,6,23,.08);color:var(--bg)}
    .hero h1{margin:0;font-size:1.6rem}
    .hero p{margin:8px 0 0;color:var(--muted)}
    /* white box with black text for the note */
    .note-box{
      background:#ffffff;
      color:#000000;
      padding:20px 16px 28px;
      border-radius:8px;
      display:block;
      max-width:64ch;
      text-align:left;
      box-sizing:border-box;
    }
    /* add 1 line of space between stacked boxes */
    .note-box + .note-box{margin-top:1rem}

    .note-box .btn{
      display:block; /* place the button on its own line */
      margin-top:16px; /* space between text and button */
      margin-left:0;
      width:auto;
    }
    .cards{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
    .card{background:rgba(255,255,255,0.96);padding:14px;border-radius:10px;flex:1 1 220px;min-width:180px;color:var(--bg);box-shadow:0 2px 6px rgba(2,6,23,.06)}
    .btn{display:inline-block;background:var(--accent);color:white;padding:10px 14px;border-radius:8px;text-decoration:none;font-weight:700}
    footer{margin-top:28px;color:var(--muted);font-size:0.9rem;text-align:center}
    @media(min-width:760px){ .hero{display:flex;align-items:center;justify-content:space-between;gap:18px} }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
       <img src="images/NoPRLogo.png" alt="No Pr Fantasy logo" width="200" height="150">
        <div>
          <div style="font-weight:800;color:var(--text)">No Pr Fantasy</div>
          <div style="font-size:0.85rem;color:var(--muted)">Fantasy Football</div>
        </div>
      </div>

      <nav aria-label="Primary">
      </nav>
    </header>

    <main>
      <section class="hero" aria-labelledby="home-title">
        <div>
          <h1 id="home-title">No Pr Fantasy</h1>
          <div class="note-box">
            <p style="margin:0">Your source for unbiased PPR rankings and league info for the 2026–2027 season.</p>
            <a class="btn" href="rankings.html">View Rankings</a>
          </div>

          <div class="note-box">
            <p style="margin:0">Gut Guys from the Guys</p>
            <a class="btn" href="gut-guys.html">View Gut Guys</a>
          </div>

          <div class="note-box">
            <p style="margin:0">Dud Guys from the Guys</p>
            <a class="btn" href="dud-guys.html">View Dud Guys</a>
          </div>

        </div>
      </section>
    </main>

  </div>

  <script>
    (function(){
      try{
        const links = document.querySelectorAll('nav a');
        const current = location.pathname.split('/').pop() || 'index.html';
        links.forEach(a=>{ if(a.getAttribute('href') === current) a.style.background = 'rgba(255,255,255,0.06)'; });
      }catch(e){}
    })();
  </script>
</body>
</html>
