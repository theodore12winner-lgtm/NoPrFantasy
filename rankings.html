<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Unbiased Rankings for 2026-2027 Fantasy Football PPR Leagues</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #234D63;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #234D63;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .search-container {
            position: relative;
            margin-bottom: 30px;
        }

        .search-box {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid #234D63;
            border-radius: 5px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-box:focus {
            border-color: #1a3647;
            box-shadow: 0 0 5px rgba(35, 77, 99, 0.3);
        }

        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: white;
            border: 1px solid #ddd;
            border-top: none;
            border-radius: 0 0 5px 5px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .autocomplete-list.show {
            display: block;
        }

        .autocomplete-item {
            padding: 10px 15px;
            cursor: pointer;
            transition: background-color 0.2s;
            border-bottom: 1px solid #f0f0f0;
        }

        .autocomplete-item:hover,
        .autocomplete-item.selected {
            background-color: #234D63;
            color: white;
        }

        .autocomplete-item:last-child {
            border-bottom: none;
        }

        .results-container {
            
            margin-top: 30px;
            height: 700px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 8px;

        }

        .no-results {
            text-align: center;
            color: #999;
            padding: 20px;
            font-size: 16px;
        }

        table {
    	    width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #FFF3E0;
        }

        th {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: #234D63;
            color: white;
            padding: 12px 15px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #1a3647;
        }

        td {
           padding: 12px 15px;
           border-bottom: 1px solid #E6C9A8;
           background-color: #FFF3E0;
        }

        tr:hover {
            background-color: #FFD8A8;
        }
        .selected-player td {
            background-color: #FFE08A !important;
            border-left: 5px solid #234D63;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #FFF1DC;
        }

        .rank-cell {
            font-weight: 600;
            color: #234D63;
            width: 80px;
        }

        .file-upload {
            margin-bottom: 20px;
        }

        .file-upload label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #234D63;
        }

        .file-upload input[type="file"] {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
        }

        .status-message {
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }

        .status-message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status-message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        .player-details{
             margin-top:20px;
              padding:20px;
              background:white;
             border-radius:8px;
             border-left:6px solid #234D63;
             box-shadow:0 2px 8px rgba(0,0,0,.1);
       }
    </style>
</head>
<body>
    <div class="container">
        <h1>Real Unbiased Rankings for 2026-2027 Fantasy Football PPR Leagues</h1>
        <div id="statusMessage" class="status-message"></div>

        <div class="search-container">
            <input 
                type="text" 
                id="playerSearch" 
                class="search-box" 
                placeholder="Enter player first name, last name... (e.g., Patrick Mahomes)"
                autocomplete="off"
            />
            <div id="autocompleteList" class="autocomplete-list"></div>
        </div>

        <div style="margin-bottom:15px;"><label><strong>Sort by:</strong></label> <select id="sortSelect"><option value="rank">Rank</option><option value="last">Last Name</option></select></div><div id="resultsContainer"></div>
           <div id="playerDetails" class="player-details">
               <h2>Select a player</h2>
               <p>Player information will appear here.</p>
           </div>
    </div>

    <script>
        let playerData = [];

        const defaultPlayerData = [
  {
    rank: "105",
    player: "Jakobi Meyers",
    description: "WR46 - Meyers was a solid WR for the Jaguars last year, but there is no telling who will actually be the WR1 in this offense."
  },
  {
    rank: "106",
    player: "Patrick Mahomes",
    description: "QB11 - Mahomes looks healthy, and this Chiefs team has been the best he has had in the past few years."
  },
  {
    rank: "107",
    player: "Kenneth Gainwell",
    description: "RB38 - Gainwell averaged 16 PPR PPG last season, but he is a receiving back. With Bucky taking most of the rushing opportunity, Gainwell will only get the receiving work."
  },
  {
    rank: "108",
    player: "Rachaad White",
    description: "RB39 - White signed with the Commanders for $2 million. White has been a historically inefficient running back, but he will get all the receiving work."
  }
];

        const playerSearch = document.getElementById('playerSearch');
        const autocompleteList = document.getElementById('autocompleteList');
        const resultsContainer = document.getElementById('resultsContainer');
        const statusMessage = document.getElementById('statusMessage');

        // Parse CSV text and populate playerData
        function parseCSV(csvText) {
            const lines = csvText.trim().split('\n');
            if (lines.length < 2) {
                showStatus('CSV file is empty or has no data rows.', 'error');
                return false;
            }

            // Parse header
            const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
            const rankIndex = headers.findIndex(h => h === 'rank');
            const playerIndex = headers.findIndex(h => h === 'player');
            const descIndex = headers.findIndex(h => h === 'description');

            if (playerIndex === -1) {
                showStatus('CSV must have a Player column.', 'error');
                return false;
            }

            // Parse data rows
            playerData = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue; // Skip empty lines

                // Handle quoted CSV fields properly
                const values = parseCSVLine(line);
                
                playerData.push({
                    rank: rankIndex !== -1 && values[rankIndex] ? values[rankIndex] : '',
                    player: playerIndex !== -1 && values[playerIndex] ? values[playerIndex] : '',
                    description: descIndex !== -1 && values[descIndex] ? values[descIndex] : ''
                });
            }

            playerData = playerData.filter(item => item.player);

            if (playerData.length === 0) {
                showStatus('No player data found in CSV file.', 'error');
                return false;
            }

            displayAllPlayers();
            playerSearch.focus();
            return true;
        }

        // Parse a single CSV line handling quoted fields
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let insideQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                const nextChar = line[i + 1];

                if (char === '"') {
                    if (insideQuotes && nextChar === '"') {
                        current += '"';
                        i++; // Skip next quote
                    } else {
                        insideQuotes = !insideQuotes;
                    }
                } else if (char === ',' && !insideQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result;
        }

        // Try to automatically load Player_Ranking_Info.csv or xlsx from the same folder
        async function loadDefaultFile() {
            try {
                const response = await fetch("Player_Ranking_Info.csv");
                if (!response.ok) throw new Error("File not found");
                const arrayBuffer = await response.arrayBuffer();
                parseWorkbook(arrayBuffer);
            } catch (error) {
                console.warn("Default file could not be loaded. Using built-in player data.");

    		 playerData = [...defaultPlayerData];

    		displayAllPlayers();

    		showStatus(
        			"Using built-in player rankings because the rankings file could not be loaded.",
        				"success"
    			);
                
            }
        }

        // Parse workbook arrayBuffer and populate playerData
        function parseWorkbook(arrayBuffer, sourceName = '') {
            try {
                const data = new Uint8Array(arrayBuffer);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });

                playerData = rows.map(row => ({
                    rank: row['Rank'] || row['rank'] || row['RANK'] || row['Position'] || '',
                    player: row['Player'] || row['player'] || row['PLAYER'] || row['Name'] || row['name'] || '',
                    description: row['Description'] || row['Describtion'] || row['description'] || row['Notes'] || row['notes'] || ''
                })).filter(item => item.player);

                if (playerData.length === 0) {
                    showStatus('The spreadsheet was loaded but no player rows were found. Make sure there is a Player column.', 'error');
                    return;
                }

                // Display all players immediately
                displayAllPlayers();
                playerSearch.focus();
            } catch (error) {
                console.error(error);
                showStatus('Error parsing the spreadsheet. Make sure it has Rank, Player, and Description columns.', 'error');
            }
        }

        function getSortedPlayers(){const m=document.getElementById("sortSelect")?.value||"rank";const a=[...playerData];if(m==="last"){a.sort((x,y)=>{const lx=x.player.trim().split(/\s+/).pop().toLowerCase(),ly=y.player.trim().split(/\s+/).pop().toLowerCase();return lx.localeCompare(ly)})}else{a.sort((x,y)=>parseInt(x.rank)||0-parseInt(y.rank)||0)}return a}
// Display all players in a table
        function displayAllPlayers() {
            if (!playerData || playerData.length === 0) {
                resultsContainer.innerHTML = '<div class="no-results">No player data to display.</div>';
                return;
            }

            const headers=`<tr>	<th onclick="sortByRank()">Rank</th> <th onclick="sortByPlayer()">Player</th><th>Description</th> </tr>`;
            const rowsHtml = getSortedPlayers().map(p => `
                <tr id="player-${p.player.replace(/\s+/g,'-')}"
    		onclick="displayPlayerInfo(playerData.find(x=>x.player==='${p.player.replace(/'/g,"\\'")}'))">
                    <td class="rank-cell">${escapeHtml(p.rank)}</td>
                    <td class="player-cell">${escapeHtml(p.player)}</td>
                    <td>${escapeHtml(p.description)}</td>
                </tr>
            `).join('');

            resultsContainer.innerHTML = `
                <table>
                    <thead>
        <tr>
            <th onclick="sortByRank()">Rank</th>
            <th onclick="sortByPlayer()">Player</th>
            <th>Description</th>
        </tr>
    </thead>
    <tbody>
        ${rowsHtml}
    </tbody>
                </table>
            `;
        }

        // Search input handler
        playerSearch.addEventListener('input', function() {
            const searchTerm = this.value.trim().toLowerCase();

            if (searchTerm.length === 0) {
                autocompleteList.classList.remove('show');
                // show all players when search is cleared
                displayAllPlayers();
                return;
            }

            // Filter players based on search term
            const matches = playerData.filter(player =>
                player.player.toLowerCase().includes(searchTerm)
            ).slice(0, 10);

            if (matches.length === 0) {
                autocompleteList.classList.remove('show');
                resultsContainer.innerHTML = '<div class="no-results">No players found matching your search.</div>';
                return;
            }

            // Display autocomplete suggestions
            autocompleteList.innerHTML = matches.map((player, index) =>
                `<div class="autocomplete-item" data-index="${index}">${escapeHtml(player.player)}</div>`
            ).join('');
            autocompleteList.classList.add('show');

            // Add click handlers to autocomplete items
            document.querySelectorAll('.autocomplete-item').forEach(item => {
                item.addEventListener('click', function() {
                    const index = parseInt(this.getAttribute('data-index'));
                    selectPlayer(matches[index]);
                });
            });
        });

        // Keyboard navigation for autocomplete
        playerSearch.addEventListener('keydown', function(e) {
            const items = document.querySelectorAll('.autocomplete-item');
            const selectedItem = document.querySelector('.autocomplete-item.selected');

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (!selectedItem && items.length > 0) {
                    items[0].classList.add('selected');
                } else if (selectedItem) {
                    const nextItem = selectedItem.nextElementSibling;
                    if (nextItem && nextItem.classList.contains('autocomplete-item')) {
                        selectedItem.classList.remove('selected');
                        nextItem.classList.add('selected');
                    }
                }
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (selectedItem) {
                    const prevItem = selectedItem.previousElementSibling;
                    if (prevItem && prevItem.classList.contains('autocomplete-item')) {
                        selectedItem.classList.remove('selected');
                        prevItem.classList.add('selected');
                    }
                }
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (selectedItem) {
                    const index = parseInt(selectedItem.getAttribute('data-index'));
                    const matches = playerData.filter(player =>
                        player.player.toLowerCase().includes(playerSearch.value.trim().toLowerCase())
                    );
                    selectPlayer(matches[index]);
                }
            } else if (e.key === 'Escape') {
                autocompleteList.classList.remove('show');
            }
        });

        // Select player from autocomplete
        function selectPlayer(player) {
            playerSearch.value = player.player;
            autocompleteList.classList.remove('show');
            displayPlayerInfo(player);
        }

        // Display player information in table
        function displayPlayerInfo(player){

    		const details=document.getElementById("playerDetails");

    		details.innerHTML=`
        		<h2>${escapeHtml(player.player)}</h2>

        	<h3>${escapeHtml(player.rank)}</h3>

        	<p>${escapeHtml(player.description)}</p>
    `;

    document
        .querySelectorAll("tr")
        .forEach(r=>r.classList.remove("selected-player"));

    const id="player-"+player.player.replace(/\s+/g,"-");

    const row=document.getElementById(id);

    if(row){

        row.classList.add("selected-player");

        row.scrollIntoView({

            behavior:"smooth",

            block:"center"

        });

    }

}

        function sortByRank(){

    playerData.sort(
        (a,b)=>parseInt(a.rank)-parseInt(b.rank)
    );

    displayAllPlayers();

}

function sortByPlayer(){

    playerData.sort(
        (a,b)=>a.player.localeCompare(b.player)
    );

    displayAllPlayers();

}

        // Show status message
        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = `status-message ${type}`;
            if (type === 'success') {
                setTimeout(() => {
                    statusMessage.className = 'status-message';
                }, 3000);
            }
        }

        // Escape HTML to avoid injection when rendering cell values
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Close autocomplete when clicking outside
        document.addEventListener('click', function(e) {
            if (e.target !== playerSearch && e.target !== autocompleteList) {
                autocompleteList.classList.remove('show');
            }
        });

        // Load default file on page load
        document.addEventListener("DOMContentLoaded",()=>{loadDefaultFile();document.getElementById("sortSelect").addEventListener("change",displayAllPlayers);});
    </script>
</body>
</html>
